<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tela ao vivo</title>
<style>
  :root {
    --bg: #101216; --panel: #191c22; --line: #2b3038;
    --fg: #e9ebee; --dim: #9aa1ab; --accent: #3d7bfd; --live: #f0484f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; border: 0; border-radius: 8px; padding: .65em 1.2em; background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #host { max-width: 560px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 1.6rem; }
  p { margin: 0; }
  .dim { color: var(--dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #link { flex: 1; min-width: 0; padding: .65em .8em; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 14px ui-monospace, Consolas, monospace; }
  #hostStatus.live { color: var(--live); font-weight: 600; }
  #viewer { position: fixed; inset: 0; background: #000; }
  #video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--dim); }
  #controls { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; }
  #controls button { opacity: .7; }
  #controls button:hover, #controls button:focus-visible { opacity: 1; }
</style>
</head>
<body>
<main id="host" hidden>
  <h1>Tela ao vivo</h1>
  <p class="dim">Transmite só a imagem da sua tela, sem nenhum som. Quem assiste continua ouvindo a própria música.</p>
  <div class="row">
    <input id="link" readonly aria-label="Link para quem vai assistir">
    <button id="copy" class="secondary">Copiar link</button>
  </div>
  <div class="row">
    <button id="start">Transmitir</button>
    <button id="stop" class="secondary" hidden>Parar</button>
  </div>
  <p id="hostStatus" class="dim" role="status">Conectando ao servidor…</p>
</main>

<div id="viewer" hidden>
  <video id="video" autoplay muted playsinline></video>
  <p id="status" role="status">Conectando…</p>
  <div id="controls">
    <button id="pip" class="secondary" hidden>Janela flutuante</button>
    <button id="fs" class="secondary" hidden>Tela cheia</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const RETRY_MS = 3000;
const SERVER_ERRORS = ['network', 'server-error', 'socket-error', 'socket-closed'];
const $ = id => document.getElementById(id);
const hostId = new URLSearchParams(location.search).get('v');
if (hostId) watch(hostId); else broadcast();

// Saved per browser, so the viewer link stays the same between streams.
function streamId() {
  let id = null;
  try { id = localStorage.getItem('stream-id'); } catch {}
  if (!id) {
    id = crypto.randomUUID();
    try { localStorage.setItem('stream-id', id); } catch {}
  }
  return id;
}

// A Peer that reconnects to the signaling server when dropped and is rebuilt when destroyed.
function livePeer(id, setup) {
  const p = id ? new Peer(id) : new Peer();
  p.on('disconnected', () => setTimeout(() => { if (!p.destroyed && p.disconnected) p.reconnect(); }, RETRY_MS));
  p.on('close', () => setTimeout(() => livePeer(id, setup), RETRY_MS));
  setup(p);
}

function broadcast() {
  $('host').hidden = false;
  const id = streamId();
  const link = location.origin + location.pathname + '?v=' + id;
  $('link').value = link;
  const viewers = new Map(); // open DataConnection -> its MediaConnection (null while not live)
  let peer = null, stream = null, problem = '';

  const render = () => {
    const n = viewers.size, who = n === 1 ? '1 pessoa' : n + ' pessoas';
    const el = $('hostStatus');
    el.className = stream && !problem ? 'live' : 'dim';
    el.textContent = problem
      || (stream ? `● Ao vivo — ${who} assistindo`
      : peer?.open ? `Pronto para transmitir — ${who} com o link aberto`
      : 'Conectando ao servidor…');
    $('start').hidden = !!stream;
    $('stop').hidden = !stream;
  };
  const sendTo = conn => viewers.set(conn, peer.call(conn.peer, stream));

  livePeer(id, p => {
    peer = p;
    p.on('open', () => { problem = ''; render(); });
    p.on('connection', conn => {
      conn.on('open', () => { viewers.set(conn, null); render(); });
      // The viewer asks until a call reaches it, so an offer lost on the signaling server is resent.
      conn.on('data', msg => {
        if (msg !== 'want' || !stream || viewers.get(conn)?.open) return;
        viewers.get(conn)?.close();
        sendTo(conn);
      });
      conn.on('close', () => { viewers.get(conn)?.close(); viewers.delete(conn); render(); });
    });
    p.on('error', e => {
      if (e.type === 'unavailable-id') problem = 'Esta transmissão já está aberta em outra aba (ou acabou de ser fechada). Tentando de novo…';
      else if (SERVER_ERRORS.includes(e.type)) problem = 'Sem conexão com o servidor. Tentando de novo…';
      else return; // e.g. a viewer left in the middle of a call
      render();
    });
  });

  $('start').onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30, max: 30 } }, audio: false });
    } catch (e) {
      if (e.name !== 'NotAllowedError') { problem = 'Não deu para capturar a tela. Use o Chrome ou o Edge no computador.'; render(); }
      return;
    }
    const track = stream.getVideoTracks()[0];
    track.contentHint = 'motion'; // Chrome keeps the frame rate and lowers resolution first
    track.addEventListener('ended', stop); // "Parar de compartilhar" in Chrome's bar
    problem = '';
    viewers.forEach((_, conn) => sendTo(conn));
    render();
  };

  function stop() {
    if (!stream) return;
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    viewers.forEach((call, conn) => { call?.close(); viewers.set(conn, null); conn.send('stop'); });
    render();
  }
  $('stop').onclick = stop;

  $('copy').onclick = () => navigator.clipboard.writeText(link)
    .then(() => { $('copy').textContent = 'Copiado!'; setTimeout(() => { $('copy').textContent = 'Copiar link'; }, 2000); })
    .catch(() => $('link').select());
}

function watch(hostId) {
  $('viewer').hidden = false;
  const video = $('video');
  video.muted = true; // a muted, audio-less video never takes audio focus from the viewer's music
  if (navigator.audioSession) navigator.audioSession.type = 'ambient'; // iOS 17+: mix with, never pause, other apps' audio
  const say = text => { $('status').textContent = text; $('status').hidden = !text; };
  let peer = null, conn = null, current = null, timer = 0;

  const show = stream => {
    stream.getAudioTracks().forEach(t => { stream.removeTrack(t); t.stop(); });
    video.srcObject = stream;
    say('');
    video.play().catch(() => say('Toque para assistir'));
  };
  const blank = text => { current?.close(); current = null; video.srcObject = null; say(text); };
  const retry = () => { clearTimeout(timer); timer = setTimeout(dial, RETRY_MS); };
  const want = () => { if (conn?.open && !current) conn.send('want'); };
  setInterval(want, RETRY_MS);

  function dial() {
    // Not peer.open: after a reconnect the server may never resend OPEN, though signaling works.
    if (!peer || peer.disconnected) return retry();
    if (conn) { conn.removeAllListeners(); conn.close(); }
    conn = peer.connect(hostId);
    conn.on('open', () => { if (!current) say('Aguardando transmissão…'); want(); });
    conn.on('data', msg => { if (msg === 'stop') blank('Transmissão pausada.'); });
    conn.on('close', () => { blank('Aguardando transmissão…'); retry(); });
    // A lost offer gets no error and no 'close', so dial again if this attempt never opens.
    const attempt = conn;
    setTimeout(() => { if (conn === attempt && !attempt.open) dial(); }, 15000);
  }

  livePeer(null, p => {
    peer = p;
    p.on('open', () => { if (conn?.open) say(current ? '' : 'Aguardando transmissão…'); else dial(); });
    p.on('call', call => {
      current?.close();
      current = call;
      call.on('stream', show);
      call.on('close', () => { if (current === call) blank('Transmissão pausada.'); });
      call.answer(); // no stream of our own: receive only
    });
    p.on('error', e => {
      if (e.type === 'peer-unavailable') { blank('Aguardando transmissão…'); retry(); }
      else if (SERVER_ERRORS.includes(e.type)) say('Sem conexão com o servidor. Tentando de novo…');
    });
  });

  // iPhone Low Power Mode refuses autoplay even for muted video; a tap starts it, still muted.
  $('viewer').onclick = () => { if (video.srcObject && video.paused) video.play().then(() => say(''), () => {}); };

  // Floating window, so the viewer can watch from inside another app (e.g. Spotify). iPhone uses the webkit API.
  if (document.pictureInPictureEnabled || video.webkitSupportsPresentationMode?.('picture-in-picture')) {
    $('pip').hidden = false;
    $('pip').onclick = () => {
      if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
      else if (video.requestPictureInPicture) video.requestPictureInPicture().catch(() => {});
      else video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
    };
  }

  if (document.fullscreenEnabled) {
    $('fs').hidden = false;
    $('fs').onclick = () => document.fullscreenElement
      ? document.exitFullscreen()
      : $('viewer').requestFullscreen().catch(() => {});
  }
}
</script>
</body>
</html>
